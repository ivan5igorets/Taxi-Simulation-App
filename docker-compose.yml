services:
  db:
    image: timescale/timescaledb-ha:pg16-ts2.28-oss
    container_name: taxi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi
      POSTGRES_DB: taxi
    ports:
      # Хост-порт 5433: 5432 на этой машине занят другим проектом.
      - "5433:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
