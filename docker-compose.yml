services:
  db:
    image: timescale/timescaledb-ha:pg16-ts2.28-oss
    container_name: taxi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi}
      POSTGRES_DB: taxi
    # Порт наружу НЕ публикуется в проде — только backend внутри docker-сети
    # обращается к db по имени сервиса. Локально при желании открой 5433:5432.
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi -d taxi"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - autoheal=true

  backend:
    build: ./backend
    container_name: taxi-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Внутри docker-сети БД доступна по имени сервиса "db", не localhost.
      DATABASE_URL: postgres://taxi:${POSTGRES_PASSWORD:-taxi}@db:5432/taxi
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3100/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    labels:
      - autoheal=true

  frontend:
    build: ./frontend
    container_name: taxi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      - autoheal=true

  # Docker сам НЕ перезапускает контейнер, если он жив, но healthcheck сообщает
  # "unhealthy" (restart-policy реагирует только на код выхода процесса или
  # перезагрузку хоста). autoheal слушает Docker socket и делает `docker restart`
  # тем сервисам с label autoheal=true, которые застряли в unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: taxi-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
